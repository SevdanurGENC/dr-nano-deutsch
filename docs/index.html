<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}*{-webkit-user-select:none;user-select:none}textarea,input{-webkit-user-select:text;user-select:text}</style>
<title>Dr Nano Deutsch</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: a single-column phone app shell (max 560px) with a sticky header and a fixed bottom tab bar; activities take over the shell. */
:root{
  --bg:#EEF2FA; --surface:#FFFFFF; --surface2:#E4EAF6; --ink:#1D2140; --muted:#5C6386; --line:#D3DAEA;
  --accent:#F07C3A; --accent-deep:#C65C1F; --accent-ink:#FFFFFF; --accent-soft:#FDE7D8;
  --teal:#18978A; --teal-soft:#D3F0EB;
  --der:#2F68D3; --die:#D23F64; --das:#1E8F57;
  --good:#1D9A5F; --good-soft:#D7F3E5; --bad:#D23F4B; --bad-soft:#FBE0E2; --gold:#E3A100;
  --f-display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:18px;
  --owl:#F28B4B; --owl-deep:#D9692B; --owl-belly:#FFE8D2; --owl-eye:#FFFFFF; --owl-ink:#2B2440; --owl-beak:#FFC23D; --owl-blush:#FF8FA3; --owl-steth:#5A6B8C;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111426; --surface:#1B1F37; --surface2:#252A47; --ink:#ECEEFA; --muted:#A2A8C9; --line:#323858;
  --accent:#FF9257; --accent-deep:#B9592A; --accent-ink:#1C1007; --accent-soft:#3B2A25;
  --teal:#4FCFC0; --teal-soft:#1B3A3E;
  --der:#80A8FF; --die:#FF7FA0; --das:#5FD69B;
  --good:#4CCF8F; --good-soft:#173A2B; --bad:#FF6D78; --bad-soft:#41222A; --gold:#FFC93F;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111426; --surface:#1B1F37; --surface2:#252A47; --ink:#ECEEFA; --muted:#A2A8C9; --line:#323858;
  --accent:#FF9257; --accent-deep:#B9592A; --accent-ink:#1C1007; --accent-soft:#3B2A25;
  --teal:#4FCFC0; --teal-soft:#1B3A3E;
  --der:#80A8FF; --die:#FF7FA0; --das:#5FD69B;
  --good:#4CCF8F; --good-soft:#173A2B; --bad:#FF6D78; --bad-soft:#41222A; --gold:#FFC93F;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
p{margin:0}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.app.activity{padding-bottom:40px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand svg{width:38px;height:38px;flex:none}
.brand b{font-family:var(--f-display);font-size:1.3rem;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.brand b span{color:var(--accent)}
.iconbtn{height:40px;min-width:40px;padding:0 12px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:800;font-size:.85rem;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.iconbtn:active{transform:translateY(1px)}

.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 3px 0 var(--line)}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:14px;font-weight:800;background:var(--surface2);color:var(--ink);box-shadow:0 3px 0 var(--line);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-deep)}
.btn.primary:active{box-shadow:0 1px 0 var(--accent-deep)}
.btn.teal{background:var(--teal);color:var(--surface);box-shadow:0 4px 0 color-mix(in srgb,var(--teal) 60%,var(--ink))}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1 1 140px}

/* hero */
.hero{display:flex;gap:14px;align-items:center;background:var(--accent-soft);border-color:transparent;box-shadow:none}
.hero svg{width:84px;height:84px;flex:none}
.owl{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bob{50%{transform:translateY(-2px) rotate(-2deg)}}
.hero h1{font-size:1.6rem}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;background:var(--surface);font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums}

.bar{height:14px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--teal);transition:width .4s}
.bar.accent>i{background:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px;text-align:center}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;font-weight:700;color:var(--muted)}
.week span{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:.9rem}
.week .on span{background:var(--accent);color:var(--accent-ink)}
.week .today{color:var(--ink)}

.story-card{display:flex;gap:14px;align-items:center}
.scene{width:68px;height:68px;flex:none;border-radius:20px;background:var(--teal-soft);display:grid;place-items:center;font-size:2.2rem}
.story-card h2{font-size:1.35rem}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gtile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:16px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);min-width:0}
.gtile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.gtile .ge{font-size:1.9rem;line-height:1}
.gtile b{font-family:var(--f-display);font-size:1.1rem}
.gtile small{color:var(--muted);font-size:.8rem;line-height:1.35}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface2);font-weight:700;font-size:.9rem}
.chip.on{background:var(--ink);color:var(--bg)}

/* articles */
.a-der{color:var(--der)} .a-die{color:var(--die)} .a-das{color:var(--das)}
.art{font-weight:800;font-size:.85em}

/* path */
.level{padding:0;overflow:hidden}
.level-head{display:flex;gap:12px;align-items:center;padding:16px 18px;background:var(--surface2)}
.level-head .le{font-size:2rem}
.level-head h2{font-size:1.25rem}
.level.locked{opacity:.6}
.snodes{display:flex;flex-direction:column;padding:8px 10px}
.snode{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:14px;text-align:left;width:100%}
.snode:hover{background:var(--surface2)}
.snode .se{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-size:1.4rem;flex:none;border:3px solid transparent}
.snode.done .se{background:var(--good-soft);border-color:var(--good)}
.snode.cur .se{border-color:var(--accent);background:var(--accent-soft)}
.snode .st{flex:1;min-width:0}
.snode .st b{display:block;font-weight:800}
.snode .st small{color:var(--muted)}
.reqs{padding:4px 18px 18px;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.req{display:flex;gap:8px;align-items:center}
.req .ck{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;background:var(--surface2);flex:none}
.req.ok .ck{background:var(--good);color:var(--surface)}

/* activity */
.acthead{display:flex;align-items:center;gap:12px;padding-block:14px 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.acthead .bar{flex:1}
.x{width:40px;height:40px;border-radius:50%;background:var(--surface);border:2px solid var(--line);font-size:1.1rem;font-weight:800;flex:none}
.steps{display:flex;gap:6px}
.steps span{flex:1;text-align:center;padding:6px 4px;border-radius:10px;font-size:.8rem;font-weight:800;background:var(--surface2);color:var(--muted)}
.steps span.on{background:var(--accent);color:var(--accent-ink)}
.steps span.past{background:var(--good-soft);color:var(--good)}

.story-top{text-align:center;padding:10px 0 4px}
.story-top .big{font-size:3.4rem;line-height:1.1}
.story-top h1{font-size:2rem}

.wcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wcard{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0}
.wcard .de{font-family:var(--f-display);font-size:1.25rem;font-weight:700;overflow-wrap:anywhere}
.wcard .ph{font-size:.8rem;color:var(--muted);font-weight:700}
.wcard .mn{font-size:.95rem}
.spk{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--teal-soft);color:var(--teal);font-size:1rem;flex:none}

.lines{display:flex;flex-direction:column;gap:12px}
.line{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:10px;align-items:flex-start;transition:border-color .2s,background .2s}
.line.playing{border-color:var(--accent);background:var(--accent-soft)}
.line .txt{flex:1;min-width:0}
.line .de{font-size:1.15rem;font-weight:600;line-height:1.6}
.line .tr{margin-top:4px;color:var(--muted);font-size:.92rem}
.tok{font-weight:800;padding:0 3px;border-radius:6px;background:var(--surface2);color:var(--teal);line-height:1.4}
.tok.a-der{color:var(--der)} .tok.a-die{color:var(--die)} .tok.a-das{color:var(--das)}
.gw{padding:0 1px;border-radius:5px;border-bottom:2px dotted var(--line);line-height:1.4}
.gw:hover,.gw:active{background:var(--surface2)}
.exlist{display:flex;flex-direction:column;gap:8px}
.ex{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;background:var(--surface2);width:100%}
.ex .exm{grid-column:1;min-width:0;overflow-wrap:anywhere}.ex .exm b{font-size:1.05rem}.ex .exm small{color:var(--muted);font-weight:700}
.ex .exr{grid-column:1;color:var(--muted);font-size:.9rem}.ex .spk{grid-column:2;grid-row:1/3}
.iconbtn.on{border-color:var(--accent)}
@media (max-width:380px){.brand b{font-size:1.1rem}.iconbtn{padding:0 9px}}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--accent);color:transparent}

/* quiz */
.qlabel{font-weight:800;color:var(--muted);text-align:center}
.qprompt{text-align:center;padding:16px 8px}
.qprompt .de{font-family:var(--f-display);font-size:2.3rem;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.qprompt .sent{font-size:1.25rem;font-weight:600;line-height:1.6}
.qprompt .hint{margin-top:6px}
.bigspk{width:96px;height:96px;border-radius:50%;background:var(--teal);color:var(--surface);font-size:2.6rem;box-shadow:0 5px 0 color-mix(in srgb,var(--teal) 60%,var(--ink))}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:60px;padding:10px 12px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:700;font-size:1.02rem;min-width:0;overflow-wrap:anywhere}
.opt.ok{background:var(--good-soft);border-color:var(--good);box-shadow:0 3px 0 var(--good)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad);box-shadow:0 3px 0 var(--bad)}
.opt.dim{opacity:.5}
.opts.art3{grid-template-columns:repeat(3,1fr)}
.opts.art3 .opt{font-family:var(--f-display);font-size:1.5rem;min-height:70px}
.fb{border-radius:16px;padding:14px 16px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb .btn{flex:0 0 auto}

/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.mt{min-height:54px;padding:8px 10px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:800;overflow-wrap:anywhere}
.mt.sel{border-color:var(--accent);background:var(--accent-soft)}
.mt.done{background:var(--good-soft);border-color:var(--good);color:var(--good);box-shadow:none;opacity:.75;pointer-events:none}
.mt.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

/* spell */
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:52px}
.slot{width:38px;height:48px;border-radius:10px;border-bottom:3px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-size:1.5rem;font-weight:700}
.slot.f{border-color:var(--accent)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{width:46px;height:52px;border-radius:12px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-family:var(--f-display);font-size:1.5rem;font-weight:700}
.tile.used{visibility:hidden}

/* result */
.result{text-align:center;padding-top:20px}
.result svg{width:120px;height:120px}
.result h1{font-size:2rem;margin-top:8px}
.score{font-family:var(--f-display);font-size:3.2rem;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}

/* words list */
.input{width:100%;min-height:48px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
textarea.input{min-height:90px;font-size:.8rem;font-family:ui-monospace,Menlo,monospace}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats div{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 4px}
.stats b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stats small{color:var(--muted);font-weight:700}
.wlist{display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);overflow:hidden}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);text-align:left;width:100%}
.wrow:first-child{border-top:0}
.wrow .wm{flex:1;min-width:0}
.wrow .wm b{font-size:1.05rem}
.wrow .wm small{display:block;color:var(--muted)}
.dots{display:flex;gap:3px;flex:none}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--surface2)}
.dots i.on{background:var(--gold)}
.lvhead{padding:8px 14px;background:var(--surface2);font-weight:800;font-size:.85rem;color:var(--muted)}

/* settings */
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border-radius:10px;font-weight:800;font-size:.9rem}
.seg button.on{background:var(--surface);box-shadow:0 2px 0 var(--line)}
.set h3{font-size:1.05rem;margin-bottom:10px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px 10px;font-size:.7rem;font-weight:800;color:var(--muted)}
.nav button .ni{font-size:1.35rem;line-height:1.2;filter:grayscale(.7);opacity:.75}
.nav button.on{color:var(--accent)}
.nav button.on .ni{filter:none;opacity:1;transform:scale(1.1)}

/* sheet & toast */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:color-mix(in srgb,var(--ink) 40%,transparent)}
.sheet-in{width:100%;max-width:560px;background:var(--surface);border-radius:24px 24px 0 0;padding:22px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.sheet .de{font-family:var(--f-display);font-size:2.2rem;font-weight:700;line-height:1.1}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;font-size:.9rem;max-width:calc(100% - 32px);text-align:center}
.burst{position:fixed;z-index:40;pointer-events:none;font-size:1.6rem;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
@media (max-width:380px){.opts{grid-template-columns:1fr}.opts.art3{grid-template-columns:repeat(3,1fr)}.wcards{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head><body>
<div class="app" id="app">
  <header class="top" id="top"></header>
  <main id="main" class="stack"></main>
</div>
<nav class="nav" id="nav"><div class="nav-in" id="navin"></div></nav>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

const DAYS={tr:['Pz','Pt','Sa','Ça','Pe','Cu','Ct'],en:['Su','Mo','Tu','We','Th','Fr','Sa']};
function t(k,v){let s=(T[S.lang]&&T[S.lang][k])||T.tr[k]||k; if(v)for(const x in v)s=s.replace('{'+x+'}',v[x]); return s;}

/* ---------- state ---------- */
const KEY='drnano-deutsch-v1';
let STORAGE_OK=true;
function defState(){return{v:1,lang:'tr',theme:'system',rate:0.85,xp:0,streak:0,last:'',days:{},words:{},stories:{},exams:{},lessons:{},recent:[]}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&typeof o==='object')return Object.assign(defState(),o);}}catch(e){STORAGE_OK=false}return defState()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){STORAGE_OK=false}}
let S=load();
try{localStorage.setItem(KEY+'-probe','1');localStorage.removeItem(KEY+'-probe')}catch(e){STORAGE_OK=false}

const pad=n=>String(n).padStart(2,'0');
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return dkey(new Date())}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return dkey(d)}
function liveStreak(){return (S.last===today()||S.last===yesterday())?S.streak:0}
function addXP(n){if(!n)return;S.xp+=n;const d=today();S.days[d]=(S.days[d]||0)+n;
  if(S.last!==d){S.streak=(S.last===yesterday())?S.streak+1:1;S.last=d;} save();}
function ws(w){const r=S.words[w.de];return r?r.s:0}
function seen(w){return !!S.words[w.de]}
function touch(w){if(!S.words[w.de]){S.words[w.de]={s:0,r:0,x:0,t:Date.now()};save();}}
function mark(w,ok){if(!w)return;const r=S.words[w.de]||{s:0,r:0,x:0};if(ok){r.s=Math.min(5,r.s+1);r.r++}else{r.s=Math.max(0,r.s-1);r.x++}r.t=Date.now();S.words[w.de]=r;save();}

/* ---------- progress logic ---------- */
function storyDone(s){const r=S.stories[s.id];return !!(r&&r.q>=80)}
function levelUnlocked(i){return i===0||(S.exams[i-1]||0)>=80}
function levelWords(i){return LEVELS[i].s.flatMap(s=>s.w)}
function mastery(i){const ws_=levelWords(i);return ws_.filter(w=>ws(w)>=3).length/ws_.length}
function storiesDone(i){return LEVELS[i].s.filter(storyDone).length}
function examReady(i){return storiesDone(i)===LEVELS[i].s.length&&mastery(i)>=0.8&&lessonsDone(i)===levelLessons(i).length}
function levelPassed(i){return (S.exams[i]||0)>=80}
function curLevel(){let c=0;LEVELS.forEach((L,i)=>{if(levelUnlocked(i))c=i});return c}
function lessonDone(L){const r=S.lessons[L.id];return !!(r&&r.q>=80)}
function levelLessons(i){return LESSONS.filter(L=>L.lv===i)}
function lessonsDone(i){return levelLessons(i).filter(lessonDone).length}
function lessonUnlocked(L){return levelUnlocked(L.lv)&&(L.idx===0||lessonDone(LESSONS[L.idx-1]))}
function nextLesson(){return LESSONS.find(L=>!lessonDone(L))||null}
function lessonDoneToday(){return LESSONS.some(L=>{const r=S.lessons[L.id];return r&&r.q>=80&&r.d===today()})}
function nextStory(){for(let i=0;i<LEVELS.length;i++){if(!levelUnlocked(i))break;for(const s of LEVELS[i].s)if(!storyDone(s))return s;}return null}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
/* picks n words: weaker words first, recently practised words pushed back, plenty of randomness */
function weakFirst(list,n){const rec=S.recent||[];
  const pick=shuffle(list).map(w=>{const ri=rec.indexOf(w.de);const recent=ri<0?0:2.6*(1-ri/rec.length);return[w,ws(w)*0.8+recent+Math.random()*2.6]})
   .sort((a,b)=>a[1]-b[1]).slice(0,n).map(x=>x[0]);remember(pick);return shuffle(pick)}
function remember(list){const r=(S.recent||[]).filter(d=>!list.some(w=>w.de===d));S.recent=list.map(w=>w.de).concat(r).slice(0,60);save()}
const isNoun=w=>w.art==='der'||w.art==='die'||w.art==='das';
function meaning(w){return S.lang==='en'?w.en:w.tr}
function other(w){return S.lang==='en'?w.tr:w.en}
function artHTML(w){if(isNoun(w))return `<span class="art a-${w.art}">${w.art}</span> `;if(w.art==='pl')return `<span class="art a-die">die</span> `;return ''}
function deHTML(w){const c=isNoun(w)?' class="a-'+w.art+'"':(w.art==='pl'?' class="a-die"':'');return artHTML(w)+`<span${c}>${esc(w.de)}</span>`}
function deText(w){return (isNoun(w)?w.art+' ':w.art==='pl'?'die ':'')+w.de}
function dots(w){const n=ws(w);let h='<span class="dots" aria-label="'+n+'/5">';for(let i=0;i<5;i++)h+=`<i class="${i<n?'on':''}"></i>`;return h+'</span>'}
function plainWords(txt){return esc(txt).replace(/[\p{L}]+/gu,m=>{const k=m.toLowerCase();
  if(LOOK[k])return `<button class="gw" data-act="word" data-w="${esc(LOOK[k].de)}">${m}</button>`;
  if(GLOSS[k])return `<button class="gw" data-act="gloss" data-g="${esc(k)}" data-o="${esc(m)}">${m}</button>`;return m})}
function lineHTML(de){return de.split(/(\{[^}]+\})/).map(part=>{const mm=part.match(/^\{([^}]+)\}$/);if(!mm)return plainWords(part);
  const tok=mm[1];const w=LOOK[tok.toLowerCase()];const cls=w&&isNoun(w)?' a-'+w.art:'';return `<button class="tok${cls}" data-act="word" data-w="${esc(w?w.de:tok)}">${esc(tok)}</button>`}).join('')}
const plain=de=>de.replace(/\{([^}]+)\}/g,'$1');

/* ---------- speech ---------- */
let deVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();deVoice=vs.find(v=>/^de[-_]DE/i.test(v.lang))||vs.find(v=>/^de/i.test(v.lang))||null}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
let voiceWarned=false;
const AT=window.AndroidTTS||null;let ttsCb=null;
window.__ttsDone=function(){const f=ttsCb;ttsCb=null;if(f)f()};
function speak(text,onend){
  if(AT){let st=0;try{st=AT.status()}catch(e){}
    if(st<0){if(!voiceWarned){voiceWarned=true;toast(t('noVoice'))}if(onend)setTimeout(onend,300);return}
    ttsCb=onend||null;try{AT.speak(String(text),S.rate,'u'+Date.now())}catch(e){ttsCb=null;if(onend)onend()}return}
  if(!('speechSynthesis' in window)){toast(t('noVoice'));onend&&onend();return}
  if(!deVoice)pickVoice();
  if(!deVoice&&!voiceWarned&&speechSynthesis.getVoices().length){voiceWarned=true;toast(t('noVoice'))}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';if(deVoice)u.voice=deVoice;u.rate=S.rate;
  if(onend){u.onend=onend;u.onerror=onend}
  speechSynthesis.speak(u);
}
function stopSpeech(){ttsCb=null;if(AT){try{AT.stop()}catch(e){}return}try{speechSynthesis.cancel()}catch(e){}}

/* ---------- ui bits ---------- */
let toastT;
function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2200)}
function burst(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const em=['🎉','⭐','🥨','✨','💛'];
  for(let i=0;i<16;i++){const s=document.createElement('span');s.className='burst';s.textContent=em[i%em.length];
  s.style.left=(window.innerWidth/2)+'px';s.style.top=(window.innerHeight*0.35)+'px';
  s.style.setProperty('--dx',(Math.random()*320-160)+'px');s.style.setProperty('--dy',(Math.random()*-260-40)+'px');s.style.setProperty('--rot',(Math.random()*360)+'deg');
  document.body.appendChild(s);setTimeout(()=>s.remove(),1200);}}

  <circle cx="23" cy="27" r="8.5" style="fill:var(--owl-eye)"/><circle cx="41" cy="27" r="8.5" style="fill:var(--owl-eye)"/>

/* ---------- view state ---------- */
let V={tab:'home',q:'',lv:'all',resetAsk:false};
let A=null; // current activity
let playing=false;

function applyTheme(){const r=document.documentElement;if(S.theme==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);r.lang=S.lang}
const THEME_ICON={system:'🌗',light:'☀️',dark:'🌙'};

function render(){
  applyTheme();
  const app=$('#app');
  $('#top').innerHTML=`<div class="brand">${mascot()}<b>Dr Nano <span>Deutsch</span></b></div>
   <button class="iconbtn" data-act="lang" aria-label="Language">${S.lang==='tr'?'TR':'EN'}</button>
   <button class="iconbtn" data-act="cycleTheme" aria-label="${t('set_theme')}">${THEME_ICON[S.theme]}</button>
   <button class="iconbtn ${V.tab==='set'?'on':''}" data-act="tab" data-t="set" aria-label="${t('nav_set')}">⚙️</button>`;
  if(A){app.classList.add('activity');$('#nav').hidden=true;$('#top').hidden=true;$('#main').innerHTML=renderActivity();afterRender();return}
  app.classList.remove('activity');$('#nav').hidden=false;$('#top').hidden=false;
  const tabs=[['home','🏡'],['path','🪜'],['lessons','📘'],['games','🎮'],['words','📚']];
  $('#navin').innerHTML=tabs.map(([k,e])=>`<button class="${V.tab===k?'on':''}" data-act="tab" data-t="${k}" aria-current="${V.tab===k?'page':'false'}"><span class="ni">${e}</span>${t('nav_'+k)}</button>`).join('');
  const m=$('#main');
  m.innerHTML=({home:renderHome,path:renderPath,lessons:renderLessons,games:renderGames,words:renderWords,set:renderSettings})[V.tab]();
  if(V.tab==='words')renderWordList();
}

/* ---------- HOME ---------- */
function renderHome(){
  const tx=S.days[today()]||0,pct=Math.min(100,tx/GOAL*100);
  const now=new Date();let week='';
  for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);const k=dkey(d);const on=(S.days[k]||0)>0;
    week+=`<div class="${on?'on':''} ${i===0?'today':''}"><span>${on?'🔥':''}</span>${DAYS[S.lang][d.getDay()]}</div>`}
  const ns=nextStory(), cl=curLevel();
  let todayCard;
  if(ns){const L=LEVELS[ns.level];const started=!!S.stories[ns.id];
    todayCard=`<div class="card stack"><div class="eyebrow">${t('today')} · ${L.cefr}</div>
    <div class="story-card"><div class="scene">${ns.e}</div><div style="min-width:0"><h2>${esc(ns.t.de)}</h2><p class="muted">${esc(ns.t[S.lang])} · ${t('wordsCount',{n:ns.w.length})}</p></div></div>
    <button class="btn primary block" data-act="openStory" data-id="${ns.id}">${started?'▶ ':'✨ '}${t('startStory')}</button></div>`;
  }else if(!levelPassed(cl)){const m=Math.round(mastery(cl)*100);const ready=examReady(cl);
    todayCard=`<div class="card stack"><div class="eyebrow">${t('exam')} · ${LEVELS[cl].cefr}</div>
    <h2>${ready?t('examCard'):t('examPrep')}</h2>
    <div><div class="row small" style="justify-content:space-between"><b>${t('mastery')}</b><span>${m}% / 80%</span></div><div class="bar accent"><i style="width:${m}%"></i></div></div>
    ${ready?`<button class="btn primary block" data-act="examIntro" data-l="${cl}">🎓 ${t('takeExam')}</button>`:`<button class="btn teal block" data-act="game" data-g="quick" data-lv="${cl}">⚡ ${t('practice')}</button>`}</div>`;
  }else{const s=STORY[Object.keys(STORY)[Math.floor(Date.now()/864e5)%Object.keys(STORY).length]];
    todayCard=`<div class="card stack"><div class="eyebrow">🏆</div><h2>${t('allDone')}</h2>
    <div class="story-card"><div class="scene">${s.e}</div><div><h2>${esc(s.t.de)}</h2><p class="muted">${esc(s.t[S.lang])}</p></div></div>

/* question builders */
function distract(w,pool,f,n=3){const seenV=new Set([f(w)]),out=[];
  for(const src of [shuffle(pool),shuffle(ALLW)])for(const x of src){if(out.length>=n)break;const v=f(x);if(!seenV.has(v)){seenV.add(v);out.push(v)}}
  return out}
function mkQ(k,w,pool){
  if(k==='meaning')return{k,w,opts:shuffle([{t:meaning(w),ok:1},...distract(w,pool,meaning).map(x=>({t:x,ok:0}))])};
  if(k==='reverse')return{k,w,opts:shuffle([{t:deText(w),ok:1},...distract(w,pool,deText).map(x=>({t:x,ok:0}))])};
  if(k==='listen')return{k,w,opts:shuffle([{t:w.de,ok:1},...distract(w,pool,x=>x.de).map(x=>({t:x,ok:0}))])};
  if(k==='article')return{k,w,opts:shuffle(['der','die','das'].map(a=>({t:a,ok:a===w.art?1:0})))};
}
function fillQ(s){const c=[];s.l.forEach(L=>(L[0].match(/\{[^}]+\}/g)||[]).forEach(m=>c.push([L,m.slice(1,-1)])));
  const [L,tok]=c[Math.random()*c.length|0];const w=LOOK[tok.toLowerCase()];let used=false;
  const sent=esc(L[0]).replace(/\{([^}]+)\}/g,(m,x)=>{if(!used&&x===tok){used=true;return '<span class="blank">_____</span>'}return x});
  const others=shuffle(s.w.filter(x=>x!==w&&x.de.toLowerCase()!==tok.toLowerCase()&&!x.de.includes(' '))).slice(0,3).map(x=>x.de);
  return{k:'fill',w,sent,line:L,opts:shuffle([{t:tok,ok:1},...others.map(x=>({t:x,ok:0}))])}}
function startMC(mode,qs,extra){stopSpeech();A=Object.assign({type:'mc',mode,qs,i:0,score:0,picked:null},extra||{})}

function renderMC(){
  const q=A.qs[A.i];const prog=Math.round(A.i/A.qs.length*100);
  let label,prompt;
  if(q.k==='meaning'){label=t('q_meaning');prompt=`<div class="de">${deHTML(q.w)}</div><p class="muted hint">/${esc(q.w.ph)}/ <button class="spk" data-act="say" data-text="${esc(deText(q.w))}">🔊</button></p>`}
  else if(q.k==='reverse'){label=t('q_reverse');prompt=`<div class="de" style="font-size:1.8rem">${esc(meaning(q.w))}</div>`}
  else if(q.k==='listen'){label=t('q_listen');prompt=`<button class="bigspk" data-act="say" data-text="${esc(q.w.de)}" aria-label="${t('listen')}">🔊</button>`}
  else if(q.k==='article'){label=t('q_article');prompt=`<div class="de">___ ${esc(q.w.de)}</div><p class="muted hint">${esc(meaning(q.w))}</p>`}
  else if(q.k==='lesson'){label=q.label;prompt=q.s?(q.s.includes('___')?`<div class="sent">${esc(q.s).replace(/___/g,'<span class="blank">_____</span>')}</div>`:`<div class="de">${esc(q.s)}</div><p class="hint"><button class="spk" data-act="say" data-text="${esc(sayable(q.s))}">🔊</button></p>`):''}
  else{label=t('q_fill');prompt=`<div class="sent">${q.sent}</div><p class="muted hint small">${esc(S.lang==='en'?q.line[2]:q.line[1])}</p>`}
  const ans=q.opts.find(o=>o.ok).t;
  const opts=q.opts.map((o,i)=>{let c='';if(A.picked!=null){if(o.ok)c='ok';else if(i===A.picked)c='bad';else c='dim'}
    const cls=q.k==='article'?' a-'+o.t:'';
    return `<button class="opt ${c}${cls}" data-act="mcAns" data-i="${i}" ${A.picked!=null?'aria-disabled="true"':''}>${esc(o.t)}</button>`}).join('');
  let fb='';
  if(A.picked!=null){const ok=q.opts[A.picked].ok;const last=A.i===A.qs.length-1;
    fb=`<div class="fb ${ok?'ok':'bad'}"><span>${ok?t('correct'):t('wrong',{a:q.k==='article'?q.w.art+' '+q.w.de:ans})}</span><button class="btn primary" data-act="mcNext">${last?'🏁':t('next')+' →'}</button></div>`}
  const tag=A.mode==='lesson'?LESSONS[A.idx].e+' '+t('lesson')+' '+(A.idx+1):A.mode==='story'?STORY[A.id].e+' Quiz':A.mode==='exam'?'🎓 '+t('exam')+' · '+LEVELS[A.level].cefr:t('g_'+A.mode);
  return `${head(prog)}<p class="eyebrow" style="text-align:center">${tag} · ${A.i+1}/${A.qs.length}</p>
  <p class="qlabel">${label}</p><div class="qprompt">${prompt}</div>
  <div class="opts ${q.k==='article'?'art3':''}">${opts}</div>${fb}`;
}
function finishMC(){
  const n=A.qs.length,pct=Math.round(A.score/n*100),pass=pct>=80;let xp,btns,extraMsg='';
  if(A.mode==='lesson'){const L=LESSONS[A.idx];const r=S.lessons[L.id]||{q:0};const first=!(r.q>=80);r.q=Math.max(r.q,pct);if(pass&&first)r.d=today();S.lessons[L.id]=r;save();
    xp=A.score*2+(pass&&first?15:0);const nx=LESSONS[A.idx+1];
    btns=pass?((nx&&lessonUnlocked(nx))?`<button class="btn primary block" data-act="openLesson" data-i="${nx.idx}">${nx.e} ${t('nextLesson')}</button>`:'')+`<button class="btn block" data-act="quit">${t('backHome')}</button>`
      :`<button class="btn primary block" data-act="openLesson" data-i="${A.idx}">${t('retry')}</button><button class="btn block" data-act="quit">${t('backHome')}</button>`;
  }else if(A.mode==='story'){const r=S.stories[A.id];const first=!(r.q>=80);r.q=Math.max(r.q||0,pct);r.r=1;save();
    xp=A.score*2+(pass&&first?20:0);
    const ns=nextStory();
    btns=pass?(ns?`<button class="btn primary block" data-act="openStory" data-id="${ns.id}">${ns.e} ${t('nextStory')}</button>`:'')+`<button class="btn block" data-act="quit">${t('backHome')}</button>`
      :`<button class="btn primary block" data-act="openStory" data-id="${A.id}">${t('retry')}</button><button class="btn block" data-act="quit">${t('backHome')}</button>`;
  }else if(A.mode==='exam'){const li=A.level;const was=levelPassed(li);S.exams[li]=Math.max(S.exams[li]||0,pct);save();
    xp=A.score*2+(pass&&!was?50:0);if(pass&&!was&&li+1<LEVELS.length)extraMsg=`<p class="pill" style="font-size:1rem">${t('levelUp')} ${LEVELS[li+1].e} ${LEVELS[li+1].cefr}</p>`;
    btns=pass?`<button class="btn primary block" data-act="goPath">🪜 ${t('nav_path')}</button>`:`<button class="btn primary block" data-act="game" data-g="quick" data-lv="${li}">⚡ ${t('practice')}</button><button class="btn block" data-act="quit">${t('backHome')}</button>`;
  }else{xp=A.score+(pass?5:0);btns=`<button class="btn primary block" data-act="game" data-g="${A.mode}">${t('playAgain')}</button><button class="btn block" data-act="quit">${t('backHome')}</button>`}
  addXP(xp);
  A={type:'result',pass,score:`${A.score}/${n}`,pct,xp,btns,extraMsg,note:(A.mode==='story'||A.mode==='exam'||A.mode==='lesson')&&!pass?t('needed'):''};
  if(pass)setTimeout(burst,50);
}
function renderResult(){return `<div class="result stack">${mascot(A.pass?'':'sad')}<h1>${A.pass?t('pass'):t('fail')}</h1>
  <div class="score">${A.score}</div><p class="muted">${A.pct}% · <b style="color:var(--gold)">+${A.xp} XP</b></p>${A.extraMsg}
  ${A.note?`<p class="muted">${A.note}</p>`:''}<div class="stack" style="gap:10px">${A.btns}</div></div>`}

/* exam */
function renderExamIntro(){const L=LEVELS[A.level];return `${head(0)}<div class="result stack">${mascot()}<h1>🎓 ${t('exam')}</h1><p><b>${L.e} ${L.cefr} · ${esc(L.t[S.lang])}</b></p>
  <p class="muted">${t('examIntro')}</p><button class="btn primary block" data-act="startExam">${t('startExam')}</button></div>`}
function buildExam(li){const ws_=shuffle(levelWords(li));const nouns=ws_.filter(isNoun);const qs=[];
  ws_.slice(0,4).forEach(w=>qs.push(mkQ('meaning',w,ws_)));ws_.slice(4,8).forEach(w=>qs.push(mkQ('reverse',w,ws_)));
  ws_.slice(8,10).forEach(w=>qs.push(mkQ('listen',w,ws_)));
  nouns.filter(w=>!ws_.slice(0,10).includes(w)).concat(nouns).slice(0,2).forEach(w=>qs.push(mkQ('article',w,ws_)));
  return shuffle(qs)}

/* games */
function gamePool(lv,weakOnly){
  if(lv!=null)return levelWords(lv);
  if(weakOnly){const w=ALLW.filter(x=>seen(x)&&ws(x)<3);if(w.length>=4)return w}
  const out=[];LEVELS.forEach((L,i)=>{if(!levelUnlocked(i))return;L.s.forEach(s=>{if(S.stories[s.id])out.push(...s.w)})});
  if(out.length<8)levelWords(0).forEach(w=>{if(!out.includes(w))out.push(w)});
  return out}
function startGame(g,lv,weakOnly){stopSpeech();const pool=gamePool(lv,weakOnly);
  if(g==='quick'){const ws_=weakFirst(pool,Math.min(10,pool.length));startMC('quick',ws_.map(w=>mkQ(Math.random()<.5?'reverse':'meaning',w,pool)))}
  else if(g==='listen'){const ws_=weakFirst(pool,Math.min(8,pool.length));startMC('listen',ws_.map(w=>mkQ('listen',w,pool)))}
  else if(g==='article'){let nouns=pool.filter(isNoun);if(nouns.length<6)nouns=nouns.concat(levelWords(0).filter(isNoun).filter(w=>!nouns.includes(w)));
    startMC('article',weakFirst(nouns,Math.min(10,nouns.length)).map(w=>mkQ('article',w,pool)))}
  else if(g==='match'){const ws_=weakFirst(pool,6);A={type:'match',words:ws_,left:shuffle(ws_),right:shuffle(ws_),sel:null,done:[],miss:0,shake:null}}
  else if(g==='spell'){const ok=pool.filter(w=>!w.de.includes(' ')&&w.de.length<=11);const ws_=weakFirst(ok,6);A={type:'spell',qs:ws_,i:0,score:0};setupSpell()}
}

/* match */
function renderMatch(){const prog=Math.round(A.done.length/A.words.length*100);
  return `${head(prog)}<p class="eyebrow" style="text-align:center">🧩 ${t('g_match')} · ${t('mistakes',{n:A.miss})}</p><p class="qlabel">${t('match_hint')}</p>
  <div class="mgrid"><div class="mcol">${A.left.map((w,i)=>`<button class="mt ${A.done.includes(w.de)?'done':''} ${A.sel===w.de?'sel':''} ${A.shake==='L'+w.de?'shake':''}" data-act="mL" data-w="${esc(w.de)}">${deHTML(w)}</button>`).join('')}</div>
  <div class="mcol">${A.right.map(w=>`<button class="mt ${A.done.includes(w.de)?'done':''} ${A.shake==='R'+w.de?'shake':''}" data-act="mR" data-w="${esc(w.de)}">${esc(meaning(w))}</button>`).join('')}</div></div>`}

/* spell */
function setupSpell(){const w=A.qs[A.i];A.letters=[...w.de];let tl;let tries=0;do{tl=shuffle(A.letters.map((c,i)=>({c,i})));tries++}while(tries<12&&A.letters.length>2&&tl.map(x=>x.c).join('')===w.de);A.tiles=tl;A.built=[];A.state=null}
function renderSpell(){const w=A.qs[A.i];const prog=Math.round(A.i/A.qs.length*100);
  const slots=A.letters.map((c,i)=>{const b=A.built[i];return `<span class="slot ${b!=null?'f':''}">${b!=null?esc(A.tiles[b].c):''}</span>`}).join('');
  const tiles=A.tiles.map((x,i)=>`<button class="tile ${A.built.includes(i)?'used':''}" data-act="spellTile" data-i="${i}" ${A.state?'disabled':''}>${esc(x.c)}</button>`).join('');
  let fb='';if(A.state){const last=A.i===A.qs.length-1;fb=`<div class="fb ${A.state}"><span>${A.state==='ok'?t('correct'):t('wrong',{a:w.de})}</span><button class="btn primary" data-act="spellNext">${last?'🏁':t('next')+' →'}</button></div>`}
  return `${head(prog)}<p class="eyebrow" style="text-align:center">🔤 ${t('g_spell')} · ${A.i+1}/${A.qs.length}</p><p class="qlabel">${t('spell_hint')}</p>
  <div class="qprompt"><div class="de" style="font-size:1.8rem">${isNoun(w)?`<span class="art a-${w.art}">${w.art}</span> `:''}${esc(meaning(w))}</div>
  <p class="hint"><button class="spk" data-act="say" data-text="${esc(w.de)}">🔊</button></p></div>
  <div class="slots">${slots}</div><div class="tiles">${tiles}</div>
  ${A.state?'':`<div class="row" style="justify-content:center"><button class="btn" data-act="spellBack" ${A.built.length?'':'disabled'}>⌫</button></div>`}${fb}`}

/* ---------- lessons ---------- */
function lessonCard(){const nl=nextLesson();const dt=lessonDoneToday();
  if(!nl)return `<div class="card"><b>${t('allLessons')}</b></div>`;
  const un=lessonUnlocked(nl);
  return `<div class="card stack"><div class="eyebrow">${dt?'✅ '+t('todayDone'):'📘 '+t('todayLesson')} · ${t('lesson')} ${nl.idx+1}/${LESSONS.length}</div>
   <div class="story-card"><div class="scene" style="background:var(--accent-soft)">${nl.e}</div><div style="min-width:0"><h2>${esc(nl.t[LI()])}</h2><p class="muted">${LEVELS[nl.lv].cefr}${dt?' · '+t('doneTodayMore'):''}</p></div></div>
   ${un?`<button class="btn ${dt?'':'primary'} block" data-act="openLesson" data-i="${nl.idx}">📘 ${dt?t('nextLesson'):t('startLesson')}</button>`:`<p class="small muted">🔒 ${t('lessonLevelLocked')}</p>`}</div>`}
function renderLessons(){const li=LI();const total=LESSONS.filter(lessonDone).length;
  const head_=`<section class="card hero">${mascot()}<div style="min-width:0"><h1>${t('nav_lessons')} 📘</h1><p class="small">${t('lessonsSub')}</p>
   <div class="pills"><span class="pill">✅ ${t('lessonsOf',{a:total,b:LESSONS.length})}</span>${lessonDoneToday()?`<span class="pill">🌟 ${t('todayDone')}</span>`:''}</div></div></section>`;
  const nl=nextLesson();
  return head_+LEVELS.map((Lv,i)=>{const ls=levelLessons(i);const un=levelUnlocked(i);
    return `<section class="card level ${un?'':'locked'}"><div class="level-head"><span class="le">${Lv.e}</span><div style="flex:1;min-width:0"><div class="eyebrow">${t('level')} ${i+1} · ${Lv.cefr}</div><h2>${esc(Lv.t[S.lang])}</h2></div><span class="pill">${un?t('lessonsOf',{a:lessonsDone(i),b:ls.length}):'🔒'}</span></div>
    <div class="snodes">${ls.map(L=>{const d=lessonDone(L),u=lessonUnlocked(L),cur=u&&L===nl;const r=S.lessons[L.id];
      const st=d?'✅ '+t('done')+' · '+r.q+'%':u?(r?t('inProg'):t('notStarted')):(un?t('lessonLocked'):t('lessonLevelLocked'));
      return `<button class="snode ${d?'done':''} ${cur?'cur':''}" ${u?`data-act="openLesson" data-i="${L.idx}"`:'disabled'}><span class="se">${u?L.e:'🔒'}</span><span class="st"><b>${L.idx+1}. ${esc(L.t[li])}</b><small>${st}</small></span>${cur?'<span>▶</span>':''}</button>`}).join('')}</div></section>`}).join('');
}
function renderLesson(){const L=LESSONS[A.idx];const li=LI();
  return `${head(35)}<div class="story-top"><div class="big">${L.e}</div><h1>${esc(L.t[li])}</h1><p class="muted">${t('lesson')} ${L.idx+1} · ${LEVELS[L.lv].cefr}</p></div>
  <section class="card hero" style="align-items:flex-start">${mascot()}<p>${fmtP(L.i[li])}</p></section>
  <p class="small muted">👆 ${t('exTap')}</p>
  ${L.b.map(b=>`<section class="card stack" style="gap:10px"><h3>${esc(b.h[li])}</h3>${b.p?`<p>${fmtP(b.p[li])}</p>`:''}
   ${b.x?`<div class="exlist">${b.x.map(x=>`<button class="ex" data-act="say" data-text="${esc(sayable(x[0]))}"><span class="exm"><b>${esc(x[0])}</b>${x[1]?` <small>/${esc(x[1])}/</small>`:''}</span><span class="exr">${esc(li?x[3]:x[2])}</span><span class="spk">🔊</span></button>`).join('')}</div>`:''}</section>`).join('')}
  <button class="btn primary block" data-act="lessonQuiz">✏️ ${t('toPractice')}</button>`}
function buildLessonQs(L){return shuffle(L.q).map(q=>{const ans=q.o[0];let say='';
  if(q.s){if(q.s.includes('___')&&typeof ans==='string'){const parts=ans.split(' … ');let k=0;say=sayable(q.s.replace(/___/g,()=>{const v=parts[k++];return v&&v!=='–'?v:''}))}else say=sayable(q.s)}
  else if(typeof ans==='string'&&!/^[\d:.]+$/.test(ans))say=ans;
  return{k:'lesson',w:null,label:q.q?loc(q.q):t('q_lesson'),s:q.s||'',say,opts:shuffle(q.o.map((o,i)=>({t:loc(o),ok:i===0?1:0})))}})}

/* ---------- word sheet ---------- */
function openSheet(de){const w=WORD[de];if(!w)return;touch(w);speak(deText(w));const s=STORY[w.story];
  const el=$('#sheet');el.innerHTML=`<div class="sheet-in" role="dialog" aria-modal="true">
   <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div class="de">${deHTML(w)}</div><button class="spk" style="width:48px;height:48px;font-size:1.3rem" data-act="say" data-text="${esc(deText(w))}">🔊</button></div>
   ${w.art==='pl'?`<p class="small muted">(${t('plural')})</p>`:''}
   <p><span class="eyebrow">${t('pron')}</span><br><b style="font-size:1.2rem">/${esc(w.ph)}/</b></p>
   <p style="font-size:1.2rem"><b>${esc(meaning(w))}</b> <span class="muted small">· ${esc(other(w))}</span></p>
   <div class="row small muted" style="justify-content:space-between"><span>${s.e} ${t('fromStory',{s:esc(s.t.de)})}</span><span class="row" style="gap:6px">${t('mastery')} ${dots(w)}</span></div>
   <button class="btn block" data-act="closeSheet">${t('close')}</button></div>`;el.hidden=false}
function openGloss(k,orig){const g=GLOSS[k];if(!g)return;speak(orig);const i=S.lang==='en'?1:0;
  const el=$('#sheet');el.innerHTML=`<div class="sheet-in" role="dialog" aria-modal="true">
   <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div class="de">${esc(orig)}</div><button class="spk" style="width:48px;height:48px;font-size:1.3rem" data-act="say" data-text="${esc(orig)}">🔊</button></div>
   <p><span class="eyebrow">${t('pron')}</span><br><b style="font-size:1.2rem">/${esc(g[2])}/</b></p>
   <p style="font-size:1.2rem"><b>${esc(g[i])}</b> <span class="muted small">· ${esc(g[1-i])}</span></p>
   <p class="small muted">💡 ${t('glossNote')}</p>
   <button class="btn block" data-act="closeSheet">${t('close')}</button></div>`;el.hidden=false}
function closeSheet(){$('#sheet').hidden=true}

/* ---------- play all ---------- */
function playAll(){const s=STORY[A.id];playing=true;render();let i=0;
  const step=()=>{document.querySelectorAll('.line').forEach(e=>e.classList.remove('playing'));
    if(!playing||!A||A.type!=='story'||i>=s.l.length){playing=false;if(A&&A.type==='story')render();return}
    const el=$('#ln'+i);if(el){el.classList.add('playing');el.scrollIntoView({block:'center',behavior:'smooth'})}
    const txt=plain(s.l[i][0]);i++;speak(txt,()=>setTimeout(step,350))};step()}

/* ---------- actions ---------- */
const ACT={
 tab:el=>{V.tab=el.dataset.t;V.resetAsk=false;render();scrollTo(0,0)},
 lang:()=>{S.lang=S.lang==='tr'?'en':'tr';save();render()},
 cycleTheme:()=>{const o=['system','light','dark'];S.theme=o[(o.indexOf(S.theme)+1)%3];save();render()},
 setLang:el=>{S.lang=el.dataset.v;save();render()},
 setTheme:el=>{S.theme=el.dataset.v;save();render()},
 setRate:el=>{S.rate=+el.dataset.v;save();render()},
 say:el=>speak(el.dataset.text),
 sayWord:el=>{const w=WORD[el.dataset.w];touch(w);speak(deText(w))},
 sayLine:el=>{playing=false;speak(plain(STORY[A.id].l[+el.dataset.i][0]))},
 word:el=>openSheet(el.dataset.w),
 gloss:el=>openGloss(el.dataset.g,el.dataset.o),
 closeSheet:()=>closeSheet(),
 openStory:el=>{playing=false;stopSpeech();openStory(el.dataset.id);render();scrollTo(0,0)},
 storyStep:el=>{playing=false;stopSpeech();A.step=el.dataset.s;render();scrollTo(0,0)},
 toggleTr:()=>{A.tr=!A.tr;render()},
 playAll:()=>playAll(),
 stopAll:()=>{playing=false;stopSpeech();render()},
 startQuiz:()=>{playing=false;const s=STORY[A.id];const lw=levelWords(s.level);
   const pickW=shuffle(s.w).slice(0,4);remember(pickW);const qs=pickW.map(w=>mkQ(Math.random()<.7?'meaning':'reverse',w,lw));qs.push(fillQ(s));startMC('story',shuffle(qs),{id:A.id});render();scrollTo(0,0)},
 mcAns:el=>{if(A.picked!=null)return;A.picked=+el.dataset.i;const q=A.qs[A.i];const ok=!!q.opts[A.picked].ok;
   mark(q.w,ok);if(ok)A.score++;if(q.k==='lesson'){if(q.say)speak(q.say)}else if(q.k!=='listen')speak(q.k==='fill'?plain(q.line[0]):deText(q.w));render()},
 mcNext:()=>{if(A.i<A.qs.length-1){A.i++;A.picked=null;render()}else{finishMC();render()}scrollTo(0,0)},
 quit:()=>{playing=false;stopSpeech();A=null;render();scrollTo(0,0)},
 goPath:()=>{A=null;V.tab='path';render();scrollTo(0,0)},
 game:el=>{const lv=el.dataset.lv!=null?+el.dataset.lv:null;startGame(el.dataset.g,lv,el.dataset.weak==='1');render();scrollTo(0,0)},
 examIntro:el=>{A={type:'examIntro',level:+el.dataset.l};render();scrollTo(0,0)},
 openLesson:el=>{playing=false;stopSpeech();A={type:'lesson',idx:+el.dataset.i};render();scrollTo(0,0)},
 lessonQuiz:()=>{const L=LESSONS[A.idx];startMC('lesson',buildLessonQs(L),{idx:A.idx});render();scrollTo(0,0)},
 startExam:()=>{const li=A.level;startMC('exam',buildExam(li),{level:li});render()},
 mL:el=>{A.sel=el.dataset.w;A.shake=null;speak(deText(WORD[A.sel]));render()},
 mR:el=>{if(!A.sel){toast(t('match_hint'));return}const r=el.dataset.w;
   if(r===A.sel){A.done.push(r);mark(WORD[r],true);A.sel=null;A.shake=null;
     if(A.done.length===A.words.length){const n=A.words.length,sc=Math.max(0,n-A.miss);const pass=A.miss<=1;addXP(sc+(pass?5:0));
       A={type:'result',pass,score:`${sc}/${n}`,pct:Math.round(sc/n*100),xp:sc+(pass?5:0),extraMsg:`<p class="muted">${t('mistakes',{n:n-sc})}</p>`,note:'',
         btns:`<button class="btn primary block" data-act="game" data-g="match">${t('playAgain')}</button><button class="btn block" data-act="quit">${t('backHome')}</button>`};if(pass)setTimeout(burst,50)}}
   else{A.miss++;mark(WORD[A.sel],false);A.shake='R'+r}
   render()},
 spellTile:el=>{const i=+el.dataset.i;if(A.state||A.built.includes(i))return;A.built.push(i);
   if(A.built.length===A.letters.length){const w=A.qs[A.i];const word=A.built.map(b=>A.tiles[b].c).join('');const ok=word===w.de;
     A.state=ok?'ok':'bad';if(ok)A.score++;mark(w,ok);speak(w.de)}render()},
 spellBack:()=>{A.built.pop();render()},
 spellNext:()=>{if(A.i<A.qs.length-1){A.i++;setupSpell();render()}else{const n=A.qs.length,sc=A.score,pass=sc/n>=0.8;const xp=sc*2+(pass?5:0);addXP(xp);
   A={type:'result',pass,score:`${sc}/${n}`,pct:Math.round(sc/n*100),xp,extraMsg:'',note:'',btns:`<button class="btn primary block" data-act="game" data-g="spell">${t('playAgain')}</button><button class="btn block" data-act="quit">${t('backHome')}</button>`};if(pass)setTimeout(burst,50);render()}},
 lv:el=>{V.lv=el.dataset.l;render()},
 copyBackup:()=>{const txt=JSON.stringify(S);const ta=$('#imp');if(AT&&AT.copy){try{AT.copy(txt);toast(t('copied'));return}catch(e){}}
   const fallback=()=>{ta.value=txt;ta.focus();ta.select();toast(t('copyFail'))};
   try{navigator.clipboard.writeText(txt).then(()=>toast(t('copied')),fallback)}catch(e){fallback()}},
 importBackup:()=>{try{const o=JSON.parse($('#imp').value.trim());if(!o||typeof o!=='object'||!('words' in o)||!('stories' in o))throw 0;
   S=Object.assign(defState(),o);save();render();toast(t('imported'))}catch(e){toast(t('importBad'))}},
 resetAsk:()=>{V.resetAsk=true;render()},
 resetNo:()=>{V.resetAsk=false;render()},
 resetYes:()=>{const keep={lang:S.lang,theme:S.theme,rate:S.rate};S=Object.assign(defState(),keep);save();V.resetAsk=false;render();toast(t('resetDone'))}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.getAttribute('aria-disabled')==='true')return;
  if(el.closest('#sheet')&&el.dataset.act!=='say'&&el.dataset.act!=='closeSheet')return;
  const f=ACT[el.dataset.act];if(f){f(el,e)}});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
document.addEventListener('input',e=>{if(e.target.id==='wsearch'){V.q=e.target.value;renderWordList()}});

function afterRender(){
  if(A&&A.type==='mc'&&A.picked==null){const q=A.qs[A.i];if(q.k==='listen'&&q._said!==true){q._said=true;setTimeout(()=>speak(q.w.de),250)}}
  if(A&&A.type==='match'&&A.shake){setTimeout(()=>{if(A&&A.type==='match'){A.shake=null}},400)}
}
window.__back=function(){
  if(!$('#sheet').hidden){closeSheet();return true}
  if(A){playing=false;stopSpeech();A=null;render();scrollTo(0,0);return true}
  if(V.tab!=='home'){V.tab='home';V.resetAsk=false;render();scrollTo(0,0);return true}
  if(AT)AT.exit();return false};
render();
</script>

</body></html>
